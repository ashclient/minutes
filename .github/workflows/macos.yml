name: Build Minutes for Mac
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: minutes-checked-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  cleanup:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel superseded builds of this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api --method GET "repos/$GH_REPO/actions/runs" -f branch="$BUILD_BRANCH" -f per_page=100 \
            --jq ".workflow_runs[] | select(.name == \"Build Minutes for Mac\" and .head_sha != \"$BUILD_SHA\" and (.status == \"queued\" or .status == \"in_progress\")) | .id" |
          while IFS= read -r run_id; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel" >/dev/null || true
            sleep 5
            status=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .status)
            if [ "$status" != completed ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/force-cancel" >/dev/null || true
            fi
          done
  build:
    needs: cleanup
    if: ${{ !cancelled() && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test hosted Google token service
        working-directory: Server/google-auth
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
      - name: Check deployed Google endpoint with native macOS networking
        run: |
          swiftc -parse-as-library Checks/hosted_auth_smoke.swift -o /tmp/minutes-hosted-auth-smoke
          /tmp/minutes-hosted-auth-smoke https://minutes-sign-in.mlitw002.chatgpt.site 21064175916-15avd7k3trqmgf1eu2dpnodrcjvcfe06.apps.googleusercontent.com
      - name: Test, check and build for Apple Silicon and Intel
        env:
          MINUTES_RUN_TESTS: '1'
          MINUTES_UNIVERSAL: '1'
          CI: 'true'
          MINUTES_GOOGLE_CLIENT_ID: ${{ vars.MINUTES_GOOGLE_CLIENT_ID }}
          MINUTES_GOOGLE_AUTH_URL: ${{ vars.MINUTES_GOOGLE_AUTH_URL }}
        run: bash build.command
      - name: Verify and package app
        run: |
          lipo dist/Minutes.app/Contents/MacOS/Minutes -verify_arch arm64 x86_64
          lipo dist/Minutes.app/Contents/Helpers/MinutesUpdateHelper -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/Minutes.app
          ditto -c -k --sequesterRsrc --keepParent dist/Minutes.app dist/Minutes-App.zip
      - name: Smoke test updater replacement and relaunch
        run: |
          python3 Checks/update_smoke.py
      - name: Capture UI preview
        continue-on-error: true
        run: |
          python3 Checks/preview_fixture.py
          for mode in assistant-button chat connections settings settings-nvidia notion google calendar finish recorder recorder-collapsed notion-destination recorder-docked delivery transcript progress progress-background; do
            if [ "$mode" = transcript ]; then python3 Checks/preview_fixture.py --long-transcript; fi
            open dist/Minutes.app --args "--preview-$mode"
            sleep 3
            screencapture -x "dist/Minutes-$mode.png"
            if [ "$mode" = recorder-docked ]; then python3 -c 'import json; d=json.load(open("/tmp/Minutes-dock-check.json")); assert d["docked"] and d["width"] == 24 and d["height"] == 44, d'; fi
            pkill -TERM -x Minutes || true
            sleep 1
          done
          for layout in Day Week Month Agenda; do
            python3 Checks/preview_fixture.py
            open dist/Minutes.app --args --preview-calendar "--calendar-layout=$layout"
            sleep 3
            screencapture -x "dist/Minutes-calendar-$layout.png"
            pkill -TERM -x Minutes || true
            sleep 1
          done
      - name: Capture native notes editor
        continue-on-error: true
        run: |
          for mode in editor-empty editor-formatted editor-ai editor-ai-blank editor-ai-expanded; do
            if [ "$mode" = editor-ai-blank ]; then python3 Checks/preview_fixture.py --editor-empty; else python3 Checks/preview_fixture.py "--$mode"; fi
            open dist/Minutes.app --args "--preview-$mode"
            sleep 3
            pgrep -x Minutes >/dev/null
            if [[ "$mode" == editor-ai* ]]; then
              python3 -c 'import json; d=json.load(open("/tmp/Minutes-inline-check.json")); assert d["shown"] and 200 <= d["width"] <= 500 and 30 <= d["height"] <= 700, d; print("Inline AI popover geometry passed:", d)'
            fi
            screencapture -x "dist/Minutes-$mode.png"
            pkill -TERM -x Minutes || true
            sleep 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Minutes-preview
          path: dist/Minutes-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Minutes-App
          path: dist/Minutes-App.zip
          if-no-files-found: error
      - name: Publish versioned GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/Minutes.app/Contents/Info.plist)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version already published; keeping its assets immutable."
          else
            shasum -a 256 dist/Minutes-App.zip > dist/SHA256SUMS.txt
            gh release create "$tag" dist/Minutes-App.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Minutes $version" --notes-file RELEASE_NOTES.md
          fi
