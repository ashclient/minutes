name: Build Minutes for Mac
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test, check and build for Apple Silicon and Intel
        env:
          MINUTES_RUN_TESTS: '1'
          MINUTES_UNIVERSAL: '1'
          CI: 'true'
        run: bash build.command
      - name: Verify and package app
        run: |
          lipo dist/Minutes.app/Contents/MacOS/Minutes -verify_arch arm64 x86_64
          lipo dist/Minutes.app/Contents/Helpers/MinutesUpdateHelper -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/Minutes.app
          ditto -c -k --sequesterRsrc --keepParent dist/Minutes.app dist/Minutes-App.zip
      - name: Smoke test updater replacement and relaunch
        run: |
          python3 Checks/update_smoke.py
      - name: Capture UI preview
        continue-on-error: true
        run: |
          python3 Checks/preview_fixture.py
          for mode in connections settings settings-nvidia notion google calendar finish recorder recorder-collapsed notion-destination recorder-docked delivery transcript progress progress-background; do
            if [ "$mode" = transcript ]; then python3 Checks/preview_fixture.py --long-transcript; fi
            open dist/Minutes.app --args "--preview-$mode"
            sleep 3
            screencapture -x "dist/Minutes-$mode.png"
            if [ "$mode" = recorder-docked ]; then python3 -c 'import json; d=json.load(open("/tmp/Minutes-dock-check.json")); assert d["docked"] and d["width"] == 24 and d["height"] == 44, d'; fi
            pkill -TERM -x Minutes || true
            sleep 1
          done
          for layout in Day Week Month Agenda; do
            python3 Checks/preview_fixture.py
            open dist/Minutes.app --args --preview-calendar "--calendar-layout=$layout"
            sleep 3
            screencapture -x "dist/Minutes-calendar-$layout.png"
            pkill -TERM -x Minutes || true
            sleep 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Minutes-preview
          path: dist/Minutes-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Minutes-App
          path: dist/Minutes-App.zip
          if-no-files-found: error
      - name: Publish versioned GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/Minutes.app/Contents/Info.plist)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version already published; keeping its assets immutable."
          else
            shasum -a 256 dist/Minutes-App.zip > dist/SHA256SUMS.txt
            gh release create "$tag" dist/Minutes-App.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Minutes $version" --notes-file RELEASE_NOTES.md
          fi
